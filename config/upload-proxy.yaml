# Optional example: replace the bucket, region and public hostname before applying.
apiVersion: v1
kind: Namespace
metadata:
  name: upload-proxy
---
apiVersion: v1
kind: Service
metadata:
  name: example-s3
  namespace: upload-proxy
spec:
  type: ExternalName
  externalName: example-bucket.s3.example-region.amazonaws.com
  ports:
    - name: https
      port: 443
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: upload-example
  namespace: upload-proxy
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/backend-protocol: HTTPS
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-ssl-name: example-bucket.s3.example-region.amazonaws.com
    nginx.ingress.kubernetes.io/proxy-ssl-server-name: "on"
    nginx.ingress.kubernetes.io/upstream-vhost: example-bucket.s3.example-region.amazonaws.com
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - upload.example.com
      secretName: upload-example-tls
  rules:
    - host: upload.example.com
      http:
        paths:
          - path: /uploads/
            pathType: Prefix
            backend:
              service:
                name: example-s3
                port:
                  name: https
